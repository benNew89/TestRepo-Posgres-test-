  part1:
    steps:
      - run: sudo apt-get --allow-releaseinfo-change update
  
  install_postgresql_client:
    steps:
      - part1
      - run: sudo apt install -y libvips postgresql-client poppler-utils || true

  run_migrations:
    steps:
      - run:
          name: Run migrations
          command: MAILERLITE_API_TOKEN=mailerlite-api-token RAILS_ENV=test bundle exec rails db:drop db:create db:schema:load --trace

