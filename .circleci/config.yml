jobs:
  build:
    docker:
      - image: cimg/ruby:3.0.5-node
        environment:
          PGHOST: localhost 
          PGUSER: root
          POSTGRES_USER: ubuntu
          POSTGRES_DB: circle_test
      - image: cimg/postgres:16.7
        environment:
          POSTGRES_USER: ubuntu
          POSTGRES_DB: circle_test
    working_directory: ~/LifeTales/lifetalesV2-server
    shell: /bin/bash --login
    environment:
      CIRCLE_ARTIFACTS: /tmp/circleci-artifacts
      CIRCLE_TEST_REPORTS: /tmp/circleci-test-results
    steps:
      - checkout
      - wait_for_postgres
      - setup_artifacts_and_tests
      - prepare_dependencies
      #- caching
      - create_database_config
      #- database_config
      - install_postgresql_client
      - run_migrations
      #- run_tests
      # Teardown: Save test results and artifacts
      #- store_test_results_and_artifacts

workflows:
  build_and_test:
    jobs:
      - build
